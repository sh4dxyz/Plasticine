#plv{bottom:calc(76px + env(safe-area-inset-bottom,0px));touch-action:pan-y}.au{flex:1;min-width:0;height:64px;border:2px solid #9aa3b5;border-radius:8px;touch-action:none;display:block}#plv select.kit{max-width:200px}.pl{font-weight:600}

<script>
(function(){
const $=id=>document.getElementById(id);
const IC={play:"<svg viewBox='0 0 24 24'><path class='f' d='M8 5l11 7-11 7z'/></svg>",pause:"<svg viewBox='0 0 24 24'><path class='f' d='M7 5h3.5v14H7zM13.5 5H17v14h-3.5z'/></svg>",rew:"<svg viewBox='0 0 24 24'><path d='M6 5v14'/><path class='f' d='M19 5l-10 7 10 7z'/></svg>",rec:"<svg viewBox='0 0 24 24'><circle class='f' cx='12' cy='12' r='6'/></svg>",undo:"<svg viewBox='0 0 24 24'><path d='M9 7H4v5'/><path d='M4.5 12a8 8 0 1 1 2.3 6'/></svg>",trash:"<svg viewBox='0 0 24 24'><path d='M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7'/></svg>",erase:"<svg viewBox='0 0 24 24'><path d='M4 16l9-10 6 5-6 8H8zM9 19h11'/></svg>",shake:"<svg viewBox='0 0 24 24'><path d='M4 12l3-3 3 6 4-9 3 6h3'/></svg>"};
const cv=$('c'),ctx=cv.getContext('2d'),bar=$('bar'),hint=$('hint');
let W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1),mode='balls';
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',resize);resize();

/* ---------- formes & instruments ---------- */
const KINDS=[
 {id:'circle',  name:'Boule',   snd:'Pluck',   color:'#f26d7d',cr:1,  inst:'pluck'},
 {id:'triangle',name:'Triangle',snd:'Marimba', color:'#f5a23c',cr:.72,inst:'marimba'},
 {id:'square',  name:'Carré',   snd:'Kalimba', color:'#5fbf7a',cr:.78,inst:'kalimba'},
 {id:'star',    name:'Étoile',  snd:'Cloche',  color:'#f2cf3a',cr:.62,inst:'bell'},
 {id:'hexagon', name:'Hexa',    snd:'Piano',   color:'#52a7e0',cr:.9, inst:'epiano'},
 {id:'diamond', name:'Losange', snd:'Flûte',   color:'#a47bd6',cr:.66,inst:'flute'},
 {id:'heart',   name:'Cœur',    snd:'Harpe',   color:'#ef7fb8',cr:.78,inst:'harp'},
 {id:'pentagon',name:'Penta',   snd:'Boîte',   color:'#3fb8af',cr:.88,inst:'musicbox'},
 {id:'cross',   name:'Croix',   snd:'Vibra',   color:'#a9805a',cr:.72,inst:'vibes'}
];
const EXTRA=[{name:'Basse',snd:'Basse',color:'#6b7a8f',inst:'bass'},{name:'Nappe',snd:'Nappe',color:'#e58f65',inst:'pad'},{name:'Synthé',snd:'Synthé',color:'#8fd14f',inst:'synth'},{name:'Violon',snd:'Violon',color:'#b5533c',inst:'violin'},{name:'Orgue',snd:'Orgue',color:'#7d8a5a',inst:'organ'},{name:'Juno',snd:'Juno',color:'#4fa3a5',inst:'juno'},{name:'Acid',snd:'Acid',color:'#d4e157',inst:'acid'},{name:'Cordes',snd:'Cordes',color:'#c0705a',inst:'strings'},{name:'Chœur',snd:'Chœur',color:'#9a8fd1',inst:'choir'},{name:'Cuivres',snd:'Cuivres',color:'#d9a82b',inst:'brass'},{name:'Clavi',snd:'Clavi',color:'#6a8f6a',inst:'clav'},{name:'Guitare',snd:'Guitare',color:'#8a6a4a',inst:'guitar'},{name:'Space',snd:'Space',color:'#5f7fd6',inst:'space'},{name:'Robot',snd:'Robot',color:'#8aa1b1',inst:'robot'},{name:'Thérémine',snd:'Thérémine',color:'#c58fd9',inst:'theremin'},{name:'Bulles',snd:'Bulles',color:'#6fd0e8',inst:'bulles'},{name:'Laser',snd:'Laser',color:'#ff5d8f',inst:'laser'},{name:'Glitch',snd:'Glitch',color:'#7cf26b',inst:'glitch'},{name:'Gamelan',snd:'Gamelan',color:'#d9a05b',inst:'gamelan'},{name:'Sitar',snd:'Sitar',color:'#e0803a',inst:'sitar'},{name:'Didjeri',snd:'Didjeri',color:'#a0764a',inst:'didj'},{name:'Verre',snd:'Verre',color:'#9fd8e8',inst:'verre'},{name:'Boing',snd:'Boing',color:'#f2b84a',inst:'boing'}];
const ALL=KINDS.concat(EXTRA);
function verts(id,R){
  const p=[],poly=(n,o,r)=>{for(let i=0;i<n;i++){const a=o+i*Math.PI*2/n;p.push([Math.cos(a)*r,Math.sin(a)*r])}};
  if(id==='circle')poly(40,0,R);else if(id==='triangle')poly(3,-Math.PI/2,R);else if(id==='square')poly(4,Math.PI/4,R);
  else if(id==='hexagon')poly(6,0,R);else if(id==='pentagon')poly(5,-Math.PI/2,R);
  else if(id==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?R*.46:R;p.push([Math.cos(a)*r,Math.sin(a)*r])}}
  else if(id==='diamond')p.push([0,-R],[R*.68,0],[0,R],[-R*.68,0]);
  else if(id==='heart'){const s=R/16.5;for(let i=0;i<40;i++){const t=i*Math.PI*2/40;p.push([16*Math.pow(Math.sin(t),3)*s,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s+1.5*s])}}
  else if(id==='cross'){const a=R*.34;[[-a,-R],[a,-R],[a,-a],[R,-a],[R,a],[a,a],[a,R],[-a,R],[-a,a],[-R,a],[-R,-a],[-a,-a]].forEach(q=>p.push(q))}
  return p;
}
function outline(id,R,j){
  const v=verts(id,R),o=[];
  for(let i=0;i<v.length;i++){const a=v[i],b=v[(i+1)%v.length],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/10));
    for(let s=0;s<n;s++){const t=s/n;o.push([a[0]+(b[0]-a[0])*t+(Math.random()-.5)*2*j,a[1]+(b[1]-a[1])*t+(Math.random()-.5)*2*j])}}
  return o;
}
function trace(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath()}
function sprite(k,R){
  const S=(R+7)*2,s=document.createElement('canvas');s.width=s.height=Math.ceil(S*dpr);
  const c=s.getContext('2d');c.scale(dpr,dpr);c.translate(S/2,S/2);
  const j=Math.max(.7,R*.035),m=outline(k.id,R,j);
  trace(c,m);c.globalAlpha=.3;c.fillStyle=k.color;c.fill();
  c.save();trace(c,m);c.clip();c.rotate(Math.random()*Math.PI);c.strokeStyle=k.color;c.lineWidth=1.8;c.lineCap='round';c.globalAlpha=.75;
  for(let y=-R*1.2;y<R*1.2;y+=4.6){c.beginPath();c.moveTo(-R*1.2,y+Math.random()*2);c.lineTo(R*1.2,y+Math.random()*2);c.stroke()}
  c.restore();c.strokeStyle='#3a3a4a';c.lineJoin=c.lineCap='round';
  c.globalAlpha=.8;c.lineWidth=1.7;trace(c,m);c.stroke();
  c.globalAlpha=.4;c.lineWidth=1;trace(c,outline(k.id,R,j*1.3));c.stroke();
  return {s,S};
}
const DRAW={
 pluck:x=>{x.moveTo(36,8);x.bezierCurveTo(64,12,60,46,36,64);x.bezierCurveTo(12,46,8,12,36,8)},
