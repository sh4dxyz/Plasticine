'Ajout de presets sur la plupart des instruments : toucher à nouveau un instrument sélectionné pour changer de son.':'Added presets on most instruments: tap a selected instrument again to change its sound.','Ajout du Lab : cinq gammes du monde représentées par des roues, parcourues en rythme par une boule qui joue chaque note.':'Added the Lab: five world scales shown as wheels, travelled in rhythm by a ball that plays each note.','Ajout du multi-touch sur les curseurs et le pad de filtre : plusieurs réglages peuvent être manipulés en même temps.':'Added multi-touch on sliders and the filter pad: several settings can be adjusted at the same time.','Ajout d’un indicateur lumineux de niveau sur les curseurs de volume de la batterie.':'Added a light level indicator on the drum volume sliders.','Ajout d’une mini-timeline dans la fenêtre de batterie.':'Added a mini-timeline in the drum window.','Ajout d’une page À propos dans le menu.':'Added an About page in the menu.','Ajustement : animation du curseur de lecture de la mini-timeline plus fluide.':'Adjustment: smoother mini-timeline playhead animation.','Ajustement : la playlist n’affiche plus que les mesures utilisées et reste synchronisée avec la mini-timeline.':'Adjustment: the playlist now only shows the bars in use and stays in sync with the mini-timeline.','Ajustement : le curseur de la mini-timeline reste contenu dans les aperçus, avec un défilement fluide d’une case à l’autre.':'Adjustment: the mini-timeline playhead stays inside the previews, with smooth scrolling from one cell to the next.','Ajustement : les kits de batterie sont regroupés dans un menu flottant à côté du sélecteur de rythme.':'Adjustment: drum kits are grouped in a floating menu next to the pattern selector.','Ajustement : menu des kits de batterie plus compact.':'Adjustment: more compact drum kit menu.','Ajustement : l’indicateur de niveau des curseurs de volume est désormais vert et reste dans la piste du curseur.':'Adjustment: the volume slider level indicator is now green and stays inside the slider track.','Aperçu sonore d’un instrument au toucher lorsque la lecture est à l’arrêt.':'Sound preview of an instrument on touch when playback is stopped.','Correctif : la lecture se poursuit désormais lors du passage de la playlist au séquenceur.':'Fix: playback now continues when switching from the playlist to the sequencer.','Correctif : la lecture se poursuit lors du passage du séquenceur à la playlist.':'Fix: playback continues when switching from the sequencer to the playlist.','Correctif : le curseur de la mini-timeline suit l’ordre des clips.':'Fix: the mini-timeline playhead follows the order of the clips.','Correctif : le curseur de lecture de la mini-timeline disparaissait au lancement de la lecture.':'Fix: the mini-timeline playhead disappeared when playback started.','Correctif : le curseur de lecture n’apparaissait pas sur les mini-aperçus de la timeline.':'Fix: the playhead did not appear on the timeline mini-previews.','Correctif : le menu des kits de batterie s’ouvrait par erreur lors du placement des premiers pas.':'Fix: the drum kit menu opened by mistake when placing the first steps.','Correctif : les mini-aperçus de la timeline se mettent à jour en temps réel pendant l’édition.':'Fix: timeline mini-previews now update in real time while editing.','Défilement d’octave libre et grille du séquenceur alignée sur le temps.':'Free octave scrolling and sequencer grid aligned to the beat.','Harmonisation du volume des instruments.':'Instrument volume balancing.','Lecture continue lors du passage entre Playlist, Séquenceur et Lab.':'Continuous playback when switching between Playlist, Sequencer and Lab.','Nouveaux instruments : Ambre et Accordéon.':'New instruments: Amber and Accordion.','Nouveaux kits de batterie : Lofi et Trap.':'New drum kits: Lofi and Trap.','Refonte de la playlist : aperçus en pixel art et défilement horizontal.':'Playlist redesign: pixel-art previews and horizontal scrolling.','Refonte des icônes des instruments.':'Instrument icons redesign.','Reverb et delay désormais appliqués à la batterie uniquement.':'Reverb and delay are now applied to the drums only.','Ajout de l’éditeur de synthèse : un appui long sur un instrument ouvre une fenêtre à curseurs pour sculpter le son (oscillateurs, filtre, enveloppes, modulation, saturation, formants).':'Added the synthesis editor: a long press on an instrument opens a slider window to shape the sound (oscillators, filter, envelopes, modulation, saturation, formants).','Nouveaux synthés : Juno, Jupiter, Prophet, OB-Xa, CS-80, Minimoog, SH-101, Odyssey, DX7 (FM), TB-303, Taurus et Stylophone, chacun avec sa banque de presets.':'New synthesizers: Juno, Jupiter, Prophet, OB-Xa, CS-80, Minimoog, SH-101, Odyssey, DX7 (FM), TB-303, Taurus and Stylophone, each with its own preset bank.','Ajout du Sampler : import ou enregistrement au micro, choix de la zone jouée sur la forme d’onde, six modes de lecture (boucle, ping-pong, une seule fois) et enregistrement par-dessus le son existant.':'Added the Sampler: import or record from the microphone, choose the region played on the waveform, six playback modes (loop, ping-pong, one-shot) and overwrite recording on top of the existing sound.','Ajout de la FX Box : risers, impacts, drones et bruitages jouables sur le clavier.':'Added the FX Box: risers, impacts, drones and sound effects playable on the keyboard.','Effets par instrument : EQ, filtres, saturation, chorus, delay et reverb réglables pour chaque instrument, appliqués à ton tracé.':'Per-instrument effects: EQ, filters, saturation, chorus, delay and reverb adjustable for each instrument and applied to your drawing.','Enregistrement de tes propres presets dans chaque instrument.':'Save your own presets in each instrument.','Plus de presets pour tous les instruments (au moins une quinzaine chacun), dont des sons du monde, des cloches FM retravaillées et des curiosités sonores.':'More presets for every instrument (at least fifteen each), including world instruments, reworked FM bells and sonic curiosities.','Chargement des sons échantillonnés plus rapide et mis en cache sur l’appareil.':'Faster loading of sampled sounds, cached on the device.','Ajout du mode nuit et de thèmes de couleur (rose, vert, mauve et bleu pastel) dans les Réglages.':'Added night mode and colour themes (pink, pastel green, purple and blue) in Settings.','Ajout de la langue anglaise : le français et l’anglais sont disponibles dans les Réglages.':'Added English: French and English are available in Settings.','Batterie : boutons pour dupliquer et supprimer un rythme, et mini-aperçu agrandi.':'Drums: buttons to duplicate and delete a pattern, and an enlarged mini-preview.','Instruments réorganisés par famille, avec icônes animées au défilement et à la sélection.':'Instruments reorganised by family, with icons animated on scroll and on selection.','Correctif : les presets sans arpège conservent désormais leur propre son.':'Fix: presets without arpeggio now keep their own sound.','Correctif : aperçus sonores plus fiables, sans chevauchement quand on change rapidement d’instrument.':'Fix: more reliable sound previews, with no overlap when switching instruments quickly.',
'Refonte des synthés : la gamme passe à douze machines aux caractères distincts (Juno-106, Prophet-5, OB-Xa, CS-80, Minimoog, SH-101, TB-303, MS-20, ARP 2600, DX7, CZ-101, Prophet VS) ; les projets qui utilisaient un synthé retiré basculent automatiquement vers le plus proche.':'Synth overhaul: the line-up now has twelve machines with distinct characters (Juno-106, Prophet-5, OB-Xa, CS-80, Minimoog, SH-101, TB-303, MS-20, ARP 2600, DX7, CZ-101, Prophet VS); projects that used a retired synth switch automatically to the closest one.','CS-80 : deux couches complètes par son, comme sur l’original, et nouvelle banque de presets.':'CS-80: two complete layers per sound, as on the original, and a new preset bank.','Minimoog et ARP 2600 : troisième oscillateur ; réverbe à ressort et sample & hold sur l’ARP 2600.':'Minimoog and ARP 2600: third oscillator; spring reverb and sample & hold on the ARP 2600.','CZ-101 : synthèse par distorsion de phase sans filtre, avec ses formes d’onde caractéristiques ; Prophet VS : synthèse vectorielle à quatre formes d’onde.':'CZ-101: filterless phase distortion synthesis with its characteristic waveforms; Prophet VS: vector synthesis with four waveforms.','Formes d’onde propres à chaque machine, jeu monophonique pour le SH-101, le Minimoog, le MS-20 et l’ARP 2600, et chorus du Juno plus fidèle.':'Waveforms specific to each machine, monophonic playing on the SH-101, Minimoog, MS-20 and ARP 2600, and a more faithful Juno chorus.','Nouvelles banques de presets pour l’ensemble des synthés, avec des sons de signature et moins de doublons.':'New preset banks for every synth, with signature sounds and fewer duplicates.','Instruments : le Xylophone (ex-Percussions) réunit xylophone, marimba, glockenspiel, vibraphone et autres lames ; la Guitare accueille de vraies basses ; les presets du Violoncelle rejoignent le Violon ; Pluck, Marimba, Basses, Violoncelle, Space et Voiture sont retirés.':'Instruments: the Xylophone (formerly Percussion) gathers xylophone, marimba, glockenspiel, vibraphone and other bars; the Guitar gets real basses; Cello presets move to the Violin; Pluck, Marimba, Basses, Cello, Space and Car are retired.','Voix : voyelles, voix synthétiques et robotiques, voyelles qui suivent la hauteur jouée et échantillons de chœur ; nouvelles banques pour Cinéma et Nappe.':'Voice: vowels, synthetic and robotic voices, vowels that follow the played pitch and choir samples; new banks for Cinema and Pad.','Batterie : nouveaux kits Trap 1, Trap 2 et Lofi ; « Pattern » remplace « Rythme ».':'Drums: new Trap 1, Trap 2 and Lofi kits; “Pattern” replaces “Rhythm”.','Nouveaux logos pour de nombreux instruments et animations retravaillées.':'New logos for many instruments and reworked animations.','Sampler : enregistrement au micro plus robuste sur les navigateurs qui refusent la capture classique.':'Sampler: more robust microphone recording on browsers that refuse the standard capture.','Correctif : position du pad de filtre dans la playlist et fin de note des lames frappées (xylophone, marimba, glockenspiel).':'Fix: filter pad position in the playlist and note release of struck bars (xylophone, marimba, glockenspiel).','Automations : la page devient un tiroir qui descend du haut de l’écran et se déplie au doigt ; en position réduite, seules les courbes restent visibles.':'Automations: the page becomes a drawer that slides down from the top of the screen and follows your finger; in its reduced position only the curves remain visible.','Automations : les pistes se réorganisent au doigt et leur ordre définit celui de la chaîne d’effets ; nouveaux effets Volume, Panoramique, Phaser, Flanger et Pompe (sidechain).':'Automations: lanes can be reordered by dragging and their order sets the effect chain; new Volume, Pan, Phaser, Flanger and Pump (sidechain) effects.','Playlist : pages de quatre mesures, jusqu’à 32 mesures, avec flèches animées, numéros toujours lisibles et aperçu de batterie fidèle à la lecture ; la playlist et la mini playlist restent sur la même page.':'Playlist: four-bar pages, up to 32 bars, with animated arrows, always readable numbers and a drum preview that matches playback; the playlist and the mini playlist stay on the same page.','Les logos de la mini playlist réagissent aux coups de batterie.':'The mini playlist logos react to drum hits.','Bêta : choix d’un pseudo à la première visite et compteur de personnes en ligne.':'Beta: nickname chosen on the first visit and a counter of people online.','Chargement plus rapide : les sons sont chargés séparément de l’application.':'Faster loading: sounds are loaded separately from the app.','Thérémine, Animaux, Cinéma et Bulles sont retirés ; les projets concernés basculent vers le son le plus proche.':'Theremin, Animals, Cinema and Bubbles are retired; affected projects switch to the closest sound.','L’application reste en portrait sur téléphone.':'The app stays in portrait on phones.','Correctif : un accord sur plusieurs traits pouvait rendre muets les autres instruments.':'Fix: a chord spread over several strokes could mute the other instruments.','Correctif : le passage de ×1 à ×2 pendant la lecture décalait la mélodie et la batterie jusqu’au tour suivant.':'Fix: switching from ×1 to ×2 during playback shifted the melody and drums until the next loop.','Correctif : relancer rapidement la lecture pouvait désynchroniser les têtes de lecture.':'Fix: quickly restarting playback could put the playheads out of sync.','Correctif : à la souris, le changement de catégorie d’instruments pouvait se figer en pleine animation.':'Fix: with a mouse, switching instrument category could freeze mid-animation.','Ajout du mode arpège par instrument : appui long sur le bouton Arp pour l’activer, appui simple pour choisir la division (dont les triolets) et le sens de lecture.':'Added an arpeggiator per instrument: long-press the Arp button to turn it on, tap it to choose the division (including triplets) and the playback direction.','Ajout d’un instrument 808 (basse trap) avec ses presets, dont des subs sans attaque et un sustain tenu.':'Added an 808 instrument (trap bass) with its presets, including attack-less subs and a held sustain.','TB-303 : tous les presets Acid sont regroupés et retravaillés (basses acides douces, distordues, avec accent) ; l’instrument Acid est supprimé.':'TB-303: all Acid presets are merged and reworked (soft, distorted and accented acid basses); the Acid instrument is removed.','Ajout de paramètres propres à chaque synthé (synchro, ring mod, PWM, multimode, saturation…) et d’un écran de routage façon DX7.':'Added synth-specific parameters (sync, ring mod, PWM, multimode, saturation…) and a DX7-style routing screen.','Batterie : une percussion remplace le tom du kit Trap et une cowbell celui du kit 808.':'Drums: a percussion replaces the tom in the Trap kit and a cowbell replaces it in the 808 kit.','Nouvelles animations des instruments : DX7, Odyssey, 808, Jupiter, Cuivres, Boîte à musique et Accordéon s’animent selon leur fonctionnement, et les autres mouvements sont plus fluides ; logos refaits en miniatures (Juno, Jupiter, Prophet, CS-80, Taurus, Space en fusée…).':'New instrument animations: DX7, Odyssey, 808, Jupiter, Brass, Music box and Accordion move according to how they work, and the other movements are smoother; logos redrawn as miniatures (Juno, Jupiter, Prophet, CS-80, Taurus, Space as a rocket…).','Le Stylophone est retiré et la FX Box devient FX.':'The Stylophone is removed and the FX Box is now called FX.','Correctif : son plus propre (moins de craquements) et réglages des synthés plus réactifs.':'Fix: cleaner sound (fewer crackles) and more responsive synth settings.',
'TB-303 : nouvelles saturations (tube, redresseur, octave, fuzz, étagée, muffler), saturation avant le filtre, ton et mélange, et une trentaine de presets distordus plus variés.':'TB-303: new distortion types (tube, rectifier, octave, fuzz, stepped, muffler), pre-filter drive, tone and mix controls, and around thirty more varied distorted presets.','Tube':'Tube','Redresseur':'Rectifier','Fuzz':'Fuzz','Étagée':'Stepped','Saturation avant filtre':'Pre-filter drive','Ton après saturation (assombrit)':'Tone after drive (darkens)','Mélange saturation (sec ↔ saturé)':'Drive mix (dry ↔ driven)',

'Nouveaux instruments : MS-20, ARP 2600 et Polysix (avec leurs banques de presets), un synthé vocal « Voix » (voix façon dialogue de jeu, extraterrestres, robots, chœurs) et dix effets cartoon dans FX (yo-yo, boing, sifflet à coulisse…).':'New instruments: MS-20, ARP 2600 and Polysix (with their preset banks), a vocal synth “Voix” (game-dialogue style voices, aliens, robots, choirs) and ten cartoon effects in FX (yo-yo, boing, slide whistle…).','Presets : les échantillons en double entre instruments sont masqués (un son n’apparaît que dans l’instrument le plus adapté) ; le métronome passe dans le menu BPM et le pinceau prend sa place dans la barre du bas.':'Presets: samples duplicated across instruments are hidden (each sound only appears in its best-suited instrument); the metronome moves into the BPM menu and the brush takes its place in the bottom bar.',
'Nouveaux instruments : Saxophone, Bois, Violoncelle, Basses, Percussions et huit romplers (D-50, JV-1080, M1, SC-88, Mellotron, Fairlight, JD-800, Emulator) avec écran de nom de preset. Chaque synthé a désormais son propre écran (pixel, fil de fer, phosphore, spectre) et son propre habillage ; logos retravaillés avec plus de relief.':'New instruments: Saxophone, Woodwinds, Cello, Basses, Percussion and eight romplers (D-50, JV-1080, M1, SC-88, Mellotron, Fairlight, JD-800, Emulator) with a preset-name screen. Each synth now has its own screen (pixel, wireframe, phosphor, spectrum) and its own skin; logos reworked with more depth.',
'Instruments répartis sur quatre lignes (Synthés, Instruments, Romplers, Autres) : un geste vertical sur la barre change de ligne, avec un carrousel 3D. La ligne Autres accueille 808, Sampler, Synthé, Basse et Nappe, et de nouveaux sons : Voitures, Animaux, Thérémine et Cinéma (synthés façon grands films).':'Instruments are split over four rows (Synths, Instruments, Romplers, Others): a vertical swipe on the bar changes row, with a 3D carousel. The Others row now holds 808, Sampler, Synth, Bass and Pad, plus new sounds: Cars, Animals, Theremin and Cinema (film-score style synths).','Nouveaux synthés : CZ-101, Prophet VS et Pro-One. Les fenêtres de synthé ajoutent un encadré LFO dont la forme suit les réglages.':'New synths: CZ-101, Prophet VS and Pro-One. Synth windows add an LFO box whose shape follows the settings.',

function openPop(p,btn,down){const was=!p.hidden;closePops();if(was)return;p.hidden=false;const r=btn.getBoundingClientRect(),w=p.offsetWidth;p.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';if(down){p.style.top=(r.bottom+8)+'px';p.style.bottom='auto'}else{p.style.bottom=(innerHeight-r.top+8)+'px';p.style.top='auto'}}

const CHANGELOG=[
 {v:'0.5.2',items:['Automations : la page devient un tiroir qui descend du haut de l’écran et se déplie au doigt ; en position réduite, seules les courbes restent visibles.','Automations : les pistes se réorganisent au doigt et leur ordre définit celui de la chaîne d’effets ; nouveaux effets Volume, Panoramique, Phaser, Flanger et Pompe (sidechain).','Playlist : pages de quatre mesures, jusqu’à 32 mesures, avec flèches animées, numéros toujours lisibles et aperçu de batterie fidèle à la lecture ; la playlist et la mini playlist restent sur la même page.','Les logos de la mini playlist réagissent aux coups de batterie.','Bêta : choix d’un pseudo à la première visite et compteur de personnes en ligne.','Chargement plus rapide : les sons sont chargés séparément de l’application.','Thérémine, Animaux, Cinéma et Bulles sont retirés ; les projets concernés basculent vers le son le plus proche.','L’application reste en portrait sur téléphone.','Correctif : un accord sur plusieurs traits pouvait rendre muets les autres instruments.','Correctif : le passage de ×1 à ×2 pendant la lecture décalait la mélodie et la batterie jusqu’au tour suivant.','Correctif : relancer rapidement la lecture pouvait désynchroniser les têtes de lecture.','Correctif : à la souris, le changement de catégorie d’instruments pouvait se figer en pleine animation.']},
 {v:'0.5.1',items:['Refonte des synthés : la gamme passe à douze machines aux caractères distincts (Juno-106, Prophet-5, OB-Xa, CS-80, Minimoog, SH-101, TB-303, MS-20, ARP 2600, DX7, CZ-101, Prophet VS) ; les projets qui utilisaient un synthé retiré basculent automatiquement vers le plus proche.','CS-80 : deux couches complètes par son, comme sur l’original, et nouvelle banque de presets.','Minimoog et ARP 2600 : troisième oscillateur ; réverbe à ressort et sample & hold sur l’ARP 2600.','CZ-101 : synthèse par distorsion de phase sans filtre, avec ses formes d’onde caractéristiques ; Prophet VS : synthèse vectorielle à quatre formes d’onde.','Formes d’onde propres à chaque machine, jeu monophonique pour le SH-101, le Minimoog, le MS-20 et l’ARP 2600, et chorus du Juno plus fidèle.','Nouvelles banques de presets pour l’ensemble des synthés, avec des sons de signature et moins de doublons.','Instruments : le Xylophone (ex-Percussions) réunit xylophone, marimba, glockenspiel, vibraphone et autres lames ; la Guitare accueille de vraies basses ; les presets du Violoncelle rejoignent le Violon ; Pluck, Marimba, Basses, Violoncelle, Space et Voiture sont retirés.','Voix : voyelles, voix synthétiques et robotiques, voyelles qui suivent la hauteur jouée et échantillons de chœur ; nouvelles banques pour Cinéma et Nappe.','Batterie : nouveaux kits Trap 1, Trap 2 et Lofi ; « Pattern » remplace « Rythme ».','Nouveaux logos pour de nombreux instruments et animations retravaillées.','Sampler : enregistrement au micro plus robuste sur les navigateurs qui refusent la capture classique.','Correctif : position du pad de filtre dans la playlist et fin de note des lames frappées (xylophone, marimba, glockenspiel).']},
 {v:'0.5',items:['Ajout du mode arpège par instrument : appui long sur le bouton Arp pour l’activer, appui simple pour choisir la division (dont les triolets) et le sens de lecture.','Ajout d’un instrument 808 (basse trap) avec ses presets, dont des subs sans attaque et un sustain tenu.','TB-303 : tous les presets Acid sont regroupés et retravaillés (basses acides douces, distordues, avec accent) ; l’instrument Acid est supprimé.','Ajout de paramètres propres à chaque synthé (synchro, ring mod, PWM, multimode, saturation…) et d’un écran de routage façon DX7.','Batterie : une percussion remplace le tom du kit Trap et une cowbell celui du kit 808.','Nouvelles animations des instruments : DX7, Odyssey, 808, Jupiter, Cuivres, Boîte à musique et Accordéon s’animent selon leur fonctionnement, et les autres mouvements sont plus fluides ; logos refaits en miniatures (Juno, Jupiter, Prophet, CS-80, Taurus, Space en fusée…).','TB-303 : nouvelles saturations (tube, redresseur, octave, fuzz, étagée, muffler), saturation avant le filtre, ton et mélange, et une trentaine de presets distordus plus variés.','Nouveaux instruments : MS-20, ARP 2600 et Polysix (avec leurs banques de presets), un synthé vocal « Voix » (voix façon dialogue de jeu, extraterrestres, robots, chœurs) et dix effets cartoon dans FX (yo-yo, boing, sifflet à coulisse…).','Nouveaux instruments : Saxophone, Bois, Violoncelle, Basses, Percussions et huit romplers (D-50, JV-1080, M1, SC-88, Mellotron, Fairlight, JD-800, Emulator) avec écran de nom de preset. Chaque synthé a désormais son propre écran (pixel, fil de fer, phosphore, spectre) et son propre habillage ; logos retravaillés avec plus de relief.','Instruments répartis sur quatre lignes (Synthés, Instruments, Romplers, Autres) : un geste vertical sur la barre change de ligne, avec un carrousel 3D. La ligne Autres accueille 808, Sampler, Synthé, Basse et Nappe, et de nouveaux sons : Voitures, Animaux, Thérémine et Cinéma (synthés façon grands films).','Nouveaux synthés : CZ-101, Prophet VS et Pro-One. Les fenêtres de synthé ajoutent un encadré LFO dont la forme suit les réglages.','Presets : les échantillons en double entre instruments sont masqués (un son n’apparaît que dans l’instrument le plus adapté) ; le métronome passe dans le menu BPM et le pinceau prend sa place dans la barre du bas.','Le Stylophone est retiré et la FX Box devient FX.','Correctif : son plus propre (moins de craquements) et réglages des synthés plus réactifs.']},
 {v:'0.4',items:['Ajout de l’éditeur de synthèse : un appui long sur un instrument ouvre une fenêtre à curseurs pour sculpter le son (oscillateurs, filtre, enveloppes, modulation, saturation, formants).','Nouveaux synthés : Juno, Jupiter, Prophet, OB-Xa, CS-80, Minimoog, SH-101, Odyssey, DX7 (FM), TB-303, Taurus et Stylophone, chacun avec sa banque de presets.','Ajout du Sampler : import ou enregistrement au micro, choix de la zone jouée sur la forme d’onde, six modes de lecture (boucle, ping-pong, une seule fois) et enregistrement par-dessus le son existant.','Ajout de la FX Box : risers, impacts, drones et bruitages jouables sur le clavier.','Effets par instrument : EQ, filtres, saturation, chorus, delay et reverb réglables pour chaque instrument, appliqués à ton tracé.','Enregistrement de tes propres presets dans chaque instrument.','Plus de presets pour tous les instruments (au moins une quinzaine chacun), dont des sons du monde, des cloches FM retravaillées et des curiosités sonores.','Chargement des sons échantillonnés plus rapide et mis en cache sur l’appareil.','Ajout du mode nuit et de thèmes de couleur (rose, vert, mauve et bleu pastel) dans les Réglages.','Ajout de la langue anglaise : le français et l’anglais sont disponibles dans les Réglages.','Batterie : boutons pour dupliquer et supprimer un rythme, et mini-aperçu agrandi.','Instruments réorganisés par famille, avec icônes animées au défilement et à la sélection.','Correctif : les presets sans arpège conservent désormais leur propre son.','Correctif : aperçus sonores plus fiables, sans chevauchement quand on change rapidement d’instrument.']},
 {v:'0.3.11',items:['Ajout du multi-touch sur les curseurs et le pad de filtre : plusieurs réglages peuvent être manipulés en même temps.','Ajustement : l’indicateur de niveau des curseurs de volume est désormais vert et reste dans la piste du curseur.']},
 {v:'0.3.10',items:['Ajout d’un indicateur lumineux de niveau sur les curseurs de volume de la batterie.']},
 {v:'0.3.9',items:['Ajustement : le curseur de la mini-timeline reste contenu dans les aperçus, avec un défilement fluide d’une case à l’autre.']},
 {v:'0.3.8',items:['Correctif : le menu des kits de batterie s’ouvrait par erreur lors du placement des premiers pas.']},
 {v:'0.3.7',items:['Ajustement : animation du curseur de lecture de la mini-timeline plus fluide.']},
 {v:'0.3.6',items:['Ajout d’une page À propos dans le menu.']},
 {v:'0.3.5',items:['Ajustement : la playlist n’affiche plus que les mesures utilisées et reste synchronisée avec la mini-timeline.','Correctif : la lecture se poursuit lors du passage du séquenceur à la playlist.']},
 {v:'0.3.4',items:['Correctif : la lecture se poursuit désormais lors du passage de la playlist au séquenceur.','Correctif : le curseur de la mini-timeline suit l’ordre des clips.','Ajustement : menu des kits de batterie plus compact.']},
 {v:'0.3.3',items:['Correctif : le curseur de lecture de la mini-timeline disparaissait au lancement de la lecture.','Ajustement : les kits de batterie sont regroupés dans un menu flottant à côté du sélecteur de rythme.']},
 {v:'0.3.2',items:['Correctif : les mini-aperçus de la timeline se mettent à jour en temps réel pendant l’édition.']},
 {v:'0.3.1',items:['Correctif : le curseur de lecture n’apparaissait pas sur les mini-aperçus de la timeline.']},
 {v:'0.3',items:['Ajout du Lab : cinq gammes du monde représentées par des roues, parcourues en rythme par une boule qui joue chaque note.','Ajout de presets sur la plupart des instruments : toucher à nouveau un instrument sélectionné pour changer de son.','Nouveaux instruments : Ambre et Accordéon.','Nouveaux kits de batterie : Lofi et Trap.','Aperçu sonore d’un instrument au toucher lorsque la lecture est à l’arrêt.','Refonte de la playlist : aperçus en pixel art et défilement horizontal.','Ajout d’une mini-timeline dans la fenêtre de batterie.','Refonte des icônes des instruments.','Harmonisation du volume des instruments.','Défilement d’octave libre et grille du séquenceur alignée sur le temps.','Lecture continue lors du passage entre Playlist, Séquenceur et Lab.','Reverb et delay désormais appliqués à la batterie uniquement.']}
];
function showChangelog(){const o=document.createElement('div');o.className='ov';const b=document.createElement('div');b.className='box cl';b.innerHTML='<h3>Changelog</h3>'+CHANGELOG.map(r=>'<h4>Version '+r.v+'</h4><ul>'+r.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>').join('')+'<div><button class="t w">Fermer</button></div>';b.querySelector('button').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};o.appendChild(b);document.body.appendChild(o)}
$('pmenu').querySelector('.vt').textContent='v'+CHANGELOG[0].v;$('tcl').onclick=()=>{closePops();showChangelog()};$('tdbg').onclick=()=>{closePops();diagShow()};
